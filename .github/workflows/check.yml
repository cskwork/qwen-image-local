name: Check skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python skills/qwen-image-local/scripts/qwen_local.py --help
      - run: cmd /c start-web.cmd --help
